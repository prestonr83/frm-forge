name: Build Container

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=FRM Forge
            org.opencontainers.image.description=Reactive FRM operations console for Ficsit Remote Monitoring.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}

      - name: Build container image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Render unRAID template
        shell: bash
        run: |
          mkdir -p dist/unraid
          repo_url="https://github.com/${GITHUB_REPOSITORY}"
          repo_slug_lc="${GITHUB_REPOSITORY,,}"
          raw_template_url="https://raw.githubusercontent.com/${repo_slug_lc}/master/unraid/frm-forge.xml"
          repo_name="${GITHUB_REPOSITORY##*/}"
          repo_name_lc="${repo_name,,}"
          image="ghcr.io/${repo_slug_lc}"
          package_url="${repo_url}/pkgs/container/${repo_name_lc}"
          date_installed="$(date +%s)"

          sed \
            -e "s|__IMAGE__|${image}|g" \
            -e "s|__REPO_URL__|${repo_url}|g" \
            -e "s|__PACKAGE_URL__|${package_url}|g" \
            -e "s|__RAW_TEMPLATE_URL__|${raw_template_url}|g" \
            -e "s|__DATE_INSTALLED__|${date_installed}|g" \
            unraid/frm-forge.xml.tmpl > dist/unraid/frm-forge.xml

      - name: Upload unRAID template artifact
        uses: actions/upload-artifact@v4
        with:
          name: unraid-template
          path: dist/unraid/frm-forge.xml
          if-no-files-found: error

      - name: Attach unRAID template to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/unraid/frm-forge.xml
          generate_release_notes: true
